memory_policy:
  default_write_mode: proposal_only

  protected:
    - /vault/mysecondbrain/MEMORY.md
    - /vault/mysecondbrain/memory/decisions/**
    - /vault/mysecondbrain/SOUL.md
    - /vault/mysecondbrain/USER.md

  controlled:
    - /vault/mysecondbrain/memory/context/**
    - /vault/mysecondbrain/memory/projects/**
    - /vault/mysecondbrain/memory/goals.md
    - /vault/mysecondbrain/memory/backlog.md

  append_only:
    - /vault/mysecondbrain/memory/inbox/**
    - /vault/mysecondbrain/memory/[0-9][0-9][0-9][0-9]-*.md

  isolated_domains:
    escalasoft:
      root: /domains/escalasoft_brain
      forbidden_global_write:
        - /vault/mysecondbrain/MEMORY.md
        - /vault/mysecondbrain/memory/context/**
        - /vault/mysecondbrain/memory/projects/**
        - /vault/mysecondbrain/memory/decisions/**
      allowed_global_bridge:
        - /vault/mysecondbrain/memory/context/escalasoft-operacao.md
        - /vault/mysecondbrain/memory/context/escalasoft-docs-strategy.md
        - /vault/mysecondbrain/memory/projects/consultoria-escalasoft.md

  index:
    enabled: false
    provider: lancedb
    source_of_truth: markdown_git
    rebuildable: true
