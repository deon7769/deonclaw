# Fake/test call-smoke policy for the built-in deonclaw.fake.echo tool.
mcp_call_policy:
  allow_real_readonly: true
  require_docker_for_real: true
  max_tool_calls: 1
  allowed_servers:
    - fake-stdio
  allowed_tools:
    - deonclaw.fake.echo
  allowed_capabilities:
    - read
  max_arguments_bytes: 65536
  max_response_bytes: 1048576
