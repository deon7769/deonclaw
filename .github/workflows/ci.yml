name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          test -z "$(gofmt -l .)"

      - name: Check whitespace
        run: git diff --check

      - name: Provider call chain fixture smoke
        run: make provider-call-chain-smoke

      - name: Proactive runtime fixture smoke
        run: make proactive-runtime-smoke

      - name: Test
        run: go test ./...
